<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Software Factory{% endblock %} · Software Factory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='factory.css') }}" />
  </head>
  <body>
    <header class="sf-top">
      <a class="sf-wordmark" href="{{ url_for('issue_home') }}"><span class="sf-wordmark-mark" aria-hidden="true"></span>Software Factory</a>
      {% block top %}{% endblock %}
      <a class="sf-top-note" href="{{ url_for('factory_metrics') }}">Metrics</a>
    </header>
    <main class="sf-page {% block page_class %}{% endblock %}">
      {% if paused_until %}
      <div class="sf-banner sf-banner-warn" role="status">
        <svg class="sf-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75V8l2.25 1.5"/></svg>
        <div class="sf-banner-body">Rate limited: the worker starts no new runs until <span class="sf-mono">{{ paused_until }}</span>.</div>
      </div>
      {% endif %}
      {% block content %}
      {% endblock %}
    </main>
  </body>
</html>
