{% extends "base.html" %}

{% block title %}{{ issue.identifier }} - Issue Context{% endblock %}

{% block content %}
    <p><a href="{{ url_for('issue_detail', issue_id=issue.id) }}">← Back to Issue Plan</a></p>

    <h1>Issue context: {{ issue.identifier }}</h1>
    <hr>

    {% if html_content %}
        <article class="markdown-body" style="padding: 20px 0;">
            {{ html_content }}
        </article>
    {% else %}
        <p style="color: #888; font-style: italic;">No issue context gathered yet.</p>
    {% endif %}

{% endblock %}
