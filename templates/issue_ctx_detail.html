{% extends "base.html" %}

{% block title %}{{ folder_name }} - Issue Context{% endblock %}

{% block content %}
    <p><a href="{{ url_for('issue_detail',issue_id=issue_id) }}">← Back to Issue Plan</a></p>

    <h1>Folder Profile: {{ folder_name }}</h1>
    <hr>

    {% if html_content %}
        <article class="markdown-body" style="padding: 20px 0;">
            {{ html_content }}
        </article>
    {% else %}
        <p style="color: #888; font-style: italic;">No issue.md file found in this folder.</p>
    {% endif %}

{% endblock %}
