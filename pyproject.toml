[project]
name = "software-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash N P", email = "akashnp1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "claude-agent-sdk>=0.2.174",
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "psutil>=7.0.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[project.scripts]
software-factory = "software_factory:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# app.py lives at the repo root, outside the package
pythonpath = ["."]
