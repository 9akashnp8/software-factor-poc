[project]
name = "software-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash N P", email = "akashnp1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "claude-agent-sdk>=0.2.174",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "markdown>=3.11.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
software-factory = "software_factory:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
